name: aurora-snake

on:
  schedule:
    - cron: "0 1 * * *"      # 每天 UTC 1 点重建贡献蛇
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate aurora snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
          OUT_DIR: assets
        run: node scripts/gen-snake.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/aurora-snake-*.svg
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m "chore: refresh aurora contribution snake"
          git push
