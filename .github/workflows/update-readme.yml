name: Update README

on:
  schedule:
    - cron: "0 */6 * * *"   # 每 6 小时
  workflow_dispatch:

jobs:
  build:
    name: Update README with recent activity
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # 1) 写入“最近动态”章节（在 <!--START_SECTION:activity--> 标记之间插入）
      - uses: jamesgeorge007/github-activity-readme@master
        with:
          GH_USERNAME: ${{ github.repository_owner }}
          MAX_LINES: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2) 更新“最后更新”时间戳（在 <!--LAST_UPDATED--> 标记处写入当前 UTC 时间）
      - name: Update last-updated timestamp
        run: |
          sed -i "s|<!--LAST_UPDATED-->.*|<!--LAST_UPDATED--> $(date -u +'%Y-%m-%d %H:%M UTC')|" README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore: update README with recent activity"
          git push